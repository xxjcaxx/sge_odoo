services:
  db:
    image: postgres:18
    user: root
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_DB=postgres
    #restart: always             # run as a service
    volumes:
        - odoo-db-data:/var/lib/postgresql/18/docker  
  odoo19:
    image: odoo:19
    user: odoo
    depends_on:
      - db
    ports:
      - "8069:8069"
      - "8072:8072"
    tty: true
    command:  ["--dev=all", "-u", "drive", "-d", "proves"]
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
      - PIP_BREAK_SYSTEM_PACKAGES=1
    volumes:
      - ./addons:/mnt/extra-addons
      - ./config:/etc/odoo
      - odoo-web-data:/var/lib/odoo
    #restart: always             # run as a service

volumes:
  odoo-web-data:
  odoo-db-data: