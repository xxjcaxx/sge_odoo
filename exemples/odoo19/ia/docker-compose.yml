services:
  db:
    image: postgres:18
    user: root
    environment:
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_DB=postgres
    #restart: always             # run as a service
    volumes:
        - ./postgresql:/var/lib/postgresql/18/docker  
  odoo19:
    image: odoo:19
    user: root
    depends_on:
      - db
    ports:
      - "8069:8069"
      - "8072:8072"
    tty: true
    command: --
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
      - PIP_BREAK_SYSTEM_PACKAGES=1
    volumes:
      - ./addons:/mnt/extra-addons
      - ./etc:/etc/odoo
    #restart: always             # run as a service
